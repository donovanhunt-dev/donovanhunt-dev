<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" fill="none" role="img" aria-label="Start a conversation">
  <defs>
    <linearGradient id="goldline" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3D79A"/>
      <stop offset="1" stop-color="#8C6A24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="#07090D"/>
  <rect x="20" y="20" width="1160" height="160" stroke="url(#goldline)" stroke-opacity="0.55"/>
  <text x="600" y="88" text-anchor="middle" fill="#8A8374" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="5">THE DOOR IS OPEN</text>
  <text x="600" y="132" text-anchor="middle" fill="#F6F1E6" font-family="Georgia, 'Times New Roman', serif" font-size="28">If the problem is real, I want to hear it.</text>
</svg>
